<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ugefund — weekly Danish grocery deals</title>
<meta name="description" content="This week's grocery deals across Lidl, Føtex, Netto, Rema 1000 and 365discount, turned into quick dinners." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#5B7A5E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ugefund" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root {
    --bg: #FAFAF8; --ink: #24241F; --ink-soft: #6B6A62; --ink-faint: #9B9A90;
    --line: #E6E3DA; --card: #FFFFFF; --accent: #5B7A5E; --accent-soft: #EAF0E7;
    --tag: #E8B94A; --heart: #C97B63; --font-head: 'Quicksand', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: var(--font-body); color: var(--ink); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 96px; }
  h1 { font-family: var(--font-head); font-weight: 700; font-size: 32px; margin: 0; }
  h2 { font-family: var(--font-head); font-weight: 600; font-size: 20px; margin: 0 0 16px; }
  h3 { font-family: var(--font-head); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .muted { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); }
  a.back { color: var(--accent); font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; margin-bottom: 18px; }
  .hero {
    display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 28px; font-size: 14px; line-height: 1.5;
  }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px; font-family: var(--font-body);
  }
  .chip.active { color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .search-wrap { position: relative; margin-bottom: 28px; }
  .search-wrap svg { position: absolute; left: 12px; top: 12px; }
  #search {
    width: 100%; padding: 10px 12px 10px 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; color: var(--ink); font-family: var(--font-body);
  }
  .section-label { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 420px) { h1 { font-size: 26px; } }

  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 32px; }
  .tile {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    cursor: pointer; text-align: left; transition: border-color .15s ease, transform .1s ease;
  }
  .tile:hover { border-color: var(--tile-color, var(--accent)); }
  .tile:active { transform: scale(0.98); }
  .tile-icon {
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: var(--tile-soft, var(--accent-soft)); margin-bottom: 10px; font-size: 18px;
  }
  .tile-name { font-family: var(--font-head); font-weight: 600; font-size: 14px; color: var(--ink); }
  .tile-sub { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .tile-count { font-size: 11px; color: var(--tile-color, var(--accent)); font-weight: 600; margin-top: 6px; }

  .deal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .deal-tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .deal-tile-img-wrap { position: relative; aspect-ratio: 1 / 1; background: var(--accent-soft); }
  .deal-tile-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .deal-tile-img-wrap .fallback-mark { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .deal-badge {
    position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 600; color: #8A6A1A;
    background: var(--tag); padding: 3px 7px; border-radius: 999px;
  }
  .deal-badge.offer { color: var(--accent); background: rgba(255,255,255,0.92); }
  .deal-star {
    position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.88); border: none; border-radius: 999px;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .deal-star:active { transform: scale(0.9); }
  .deal-countdown {
    position: absolute; bottom: 8px; left: 8px; font-size: 10px; color: #fff; background: rgba(36,36,31,0.72);
    padding: 2px 7px; border-radius: 999px;
  }
  .deal-tile-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .deal-tile-name { font-size: 13px; font-weight: 500; line-height: 1.3; }
  .deal-tile-da { font-size: 11px; color: var(--ink-faint); line-height: 1.3; }
  .deal-tile-store { font-size: 11px; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .deal-tile-prices { margin-top: auto; padding-top: 6px; }
  .deal-tile-was { font-size: 11px; color: var(--ink-soft); text-decoration: line-through; }
  .deal-tile-now { font-size: 15px; font-weight: 700; }
  .deal-tile-unitprice { font-size: 10px; color: var(--ink-faint); }

  .meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .meal-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; transition: border-color .15s ease; }
  .meal-card:hover { border-color: var(--accent); }
  .meal-card .chev { transition: transform .15s ease; }
  .meal-card.open .chev { transform: rotate(180deg); }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; }
  .icon-btn:active { transform: scale(0.88); }
  .meal-detail { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; display: none; }
  .meal-card.open .meal-detail { display: block; }
  .meal-detail ul, .meal-detail ol { margin: 0; padding: 0; }
  .meal-detail ul { list-style: none; margin-bottom: 12px; }
  .meal-detail li { font-size: 13px; padding: 5px 0; }
  .ing-row { display: flex; justify-content: space-between; gap: 8px; }
  .meal-detail ol { padding-left: 18px; color: var(--ink-soft); font-size: 13px; line-height: 1.6; }

  .list-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; gap: 10px; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; }
  .fav-status-on { font-size: 12px; color: var(--accent); font-weight: 600; }
  .fav-status-off { font-size: 12px; color: var(--ink-faint); }
  .store-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); white-space: nowrap; }

  .shop-group { margin-bottom: 14px; }
  .shop-group-head { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .shop-item { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .shop-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="wrap">

  <header style="margin-bottom:32px;">
    <div class="between">
      <h1 style="cursor:pointer;" id="home-link">Ugefund</h1>
      <span class="muted" style="font-size:14px;" id="last-updated">Loading…</span>
    </div>
    <p class="muted" style="font-size:15px; margin-top:6px; line-height:1.5;">
      This week's grocery deals across Lidl, Føtex, Netto, Rema 1000 and 365discount — turned into quick dinners.
    </p>
  </header>

  <div id="main-content"></div>

</div>

<script>
const STORES = [
  { id: "lidl", name: "Lidl", color: "#4A6FA5" },
  { id: "foetex", name: "Føtex", color: "#B5573F" },
  { id: "netto", name: "Netto", color: "#C79A2B" },
  { id: "rema", name: "Rema 1000", color: "#3E7C74" },
  { id: "365", name: "365discount", color: "#7D5BA6" },
];

const CATEGORY_META = {
  "Kød & fisk":           { en: "Meat & fish",         color: "#B5573F", icon: "🥩" },
  "Mejeri":               { en: "Dairy",               color: "#4A6FA5", icon: "🥛" },
  "Frugt & grønt":        { en: "Fruit & veg",         color: "#5B7A5E", icon: "🥕" },
  "Kolonial":             { en: "Pantry",              color: "#C79A2B", icon: "🌾" },
  "Drikkevarer":          { en: "Drinks",              color: "#2E9BB0", icon: "🥤" },
  "Slik & chokolade":     { en: "Sweets",              color: "#C2678B", icon: "🍬" },
  "Rengøring & hygiejne": { en: "Toiletries & cleaning", color: "#6B7A8F", icon: "🧴" },
};
const HOUSEHOLD_KEY = "household";
const HOUSEHOLD_META = { en: "Household, deco & school", da: "Bolig, pynt og skole", color: "#7D5BA6", icon: "📦" };

const HOUSEHOLD_ITEMS = [
  { en: "Storage boxes & baskets", da: "Opbevaringskasser og kurve", stores: ["lidl", "foetex"] },
  { en: "Kitchen storage jars", da: "Køkkenopbevaring", stores: ["lidl"] },
  { en: "Scented candles", da: "Duftlys", stores: ["lidl", "365"] },
  { en: "Throw blankets & cushions", da: "Tæpper og puder", stores: ["foetex", "netto"] },
  { en: "Notebooks & stationery", da: "Notesbøger og skrivegrej", stores: ["netto", "foetex"] },
  { en: "School bags & pencil cases", da: "Skoletasker og penalhuse", stores: ["foetex", "netto"] },
  { en: "Plant pots", da: "Urtepotter", stores: ["lidl", "365"] },
  { en: "Picture frames & wall decor", da: "Billedrammer og vægpynt", stores: ["lidl", "foetex"] },
];

const MEALS = [
  { id:"curry-kylling", name:"Hurtig kyllingecurry med ris", nameEn:"Quick chicken curry with rice", time:20, servings:4,
    ingredients:[["Kyllingefileter","Chicken fillets"],["Løg","Onion"],["Ris","Rice"],["Karry (skabsvare)","Curry powder (pantry)"],["Fløde eller kokosmælk","Cream or coconut milk"]],
    steps:["Cut the chicken into cubes and fry in a little oil over high heat.","Add chopped onion and curry powder, cook for 2 min.","Pour in cream or coconut milk, let simmer for 8-10 min.","Serve with cooked rice."] },
  { id:"bolognese", name:"Pasta med hakket oksekød", nameEn:"Pasta with ground beef", time:25, servings:4,
    ingredients:[["Hakket oksekød 8-12%","Ground beef 8-12%"],["Løg","Onion"],["Tomater","Tomatoes"],["Pasta, penne","Pasta, penne"],["Hvidløg (skabsvare)","Garlic (pantry)"]],
    steps:["Sauté onion and garlic, add the beef and brown it well.","Add chopped tomatoes, let simmer for 10-12 min.","Cook the pasta as per the package, then mix everything together."] },
  { id:"laks-gront", name:"Ovnbagt laks med agurksalat", nameEn:"Oven-baked salmon with cucumber salad", time:20, servings:2,
    ingredients:[["Laksefileter","Salmon fillets"],["Agurk","Cucumber"],["Citron (skabsvare)","Lemon (pantry)"],["Ris","Rice"]],
    steps:["Preheat the oven to 200°C and bake the salmon for 12-14 min.","Slice the cucumber thinly and toss with lemon, salt and oil.","Serve the salmon with rice and the cucumber salad."] },
  { id:"aeggekage", name:"Æggekage med løg", nameEn:"Onion omelette", time:12, servings:2,
    ingredients:[["Æg","Eggs"],["Løg","Onion"],["Rugbrød","Rye bread"],["Sødmælk","Whole milk"]],
    steps:["Whisk the eggs with a splash of milk, salt and pepper.","Sauté chopped onion until soft, then pour in the egg mixture.","Cook over low heat until set. Serve with rye bread."] },
  { id:"reje-karry", name:"Rejer i karry med ris", nameEn:"Shrimp curry with rice", time:15, servings:3,
    ingredients:[["Frosne rejer","Frozen shrimp"],["Løg","Onion"],["Karry (skabsvare)","Curry powder (pantry)"],["Ris","Rice"],["Flødeost, naturel","Cream cheese, plain"]],
    steps:["Thaw the shrimp, then sauté onion and curry powder in a pot.","Add cream cheese and a little water, stir into a creamy sauce.","Fold in the shrimp for the last 2 min. Serve with rice."] },
  { id:"svin-kartofler", name:"Hakket svinekød med kartofler", nameEn:"Ground pork with potatoes", time:25, servings:4,
    ingredients:[["Hakket svinekød 8-14%","Ground pork 8-14%"],["Kartofler","Potatoes"],["Løg","Onion"],["Tomater","Tomatoes"]],
    steps:["Boil the potatoes until tender, about 15 min.","Brown the meat and onion in a pan, then add chopped tomatoes.","Simmer for 5 min and serve together with the potatoes."] },
];

let DEALS = [];
let STORE_LOGOS = {};
let STORE_LINKS = {};
let view = "home";
let activeCategory = null;
let activeStores = new Set(STORES.map(s => s.id));
let query = "";
let openMealId = null;
let savedOnly = false;
let savedIds = new Set(JSON.parse(localStorage.getItem("ugefund-saved") || "[]"));
let favProducts = new Set(JSON.parse(localStorage.getItem("ugefund-fav-products") || "[]"));
let listMealIds = new Set(JSON.parse(localStorage.getItem("ugefund-shopping-list") || "[]"));

const norm = s => (s || "").toLowerCase();
const storeInfo = id => STORES.find(s => s.id === id);
const discountPct = d => d.was ? Math.round((1 - d.price / d.was) * 100) : null;
const textMatches = (a, b) => norm(a).includes(norm(b)) || norm(b).includes(norm(a));

function unitPrice(d) {
  const q = d.qty;
  if (!q) return null;
  if (q.size && q.unit) {
    const u = q.unit.toLowerCase();
    if (u === "g") return { value: d.price / (q.size / 1000), label: "kr/kg" };
    if (u === "kg") return { value: d.price / q.size, label: "kr/kg" };
    if (u === "ml") return { value: d.price / (q.size / 1000), label: "kr/L" };
    if (u === "l") return { value: d.price / q.size, label: "kr/L" };
    if (u === "cl") return { value: d.price / (q.size / 100), label: "kr/L" };
  }
  if (q.pieces) return { value: d.price / q.pieces, label: "kr/pc" };
  return null;
}

function countdownLabel(d) {
  if (!d.validUntil) return null;
  const end = new Date(d.validUntil);
  if (isNaN(end)) return null;
  const diffMs = end - new Date();
  if (diffMs <= 0) return null;
  const days = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
  return days <= 1 ? "Ends today" : `Ends in ${days}d`;
}

function storeMark(id, size) {
  const s = storeInfo(id);
  const logo = STORE_LOGOS[id];
  if (logo) {
    return `<img src="${logo}" alt="${s ? s.name : id} logo" style="width:${size}px; height:${size}px; border-radius:999px; object-fit:cover; flex-shrink:0; background:#fff; border:1px solid var(--line);" />`;
  }
  return `<span class="dot" style="background:${s ? s.color : "#999"}"></span>`;
}

function persistSaved() { localStorage.setItem("ugefund-saved", JSON.stringify([...savedIds])); }
function persistFavs() { localStorage.setItem("ugefund-fav-products", JSON.stringify([...favProducts])); }
function persistList() { localStorage.setItem("ugefund-shopping-list", JSON.stringify([...listMealIds])); }

function starIcon(filled) {
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="${filled ? "#E8B94A" : "none"}" stroke="${filled ? "#E8B94A" : "#9B9A90"}" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 16.5 14.5 18.5 22 12 17.5 5.5 22 7.5 14.5 2 9.5 9 9"/></svg>`;
}
function heartIcon(filled) {
  return `<svg width="17" height="17" viewBox="0 0 24 24" fill="${filled ? "#C97B63" : "none"}" stroke="${filled ? "#C97B63" : "#9B9A90"}" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>`;
}
function basketIcon(filled) {
  return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="${filled ? "var(--accent)" : "#9B9A90"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" fill="${filled ? "var(--accent-soft)" : "none"}"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`;
}

function linkIcon() {
  return `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>`;
}

async function loadDeals() {
  try {
    const res = await fetch("./deals.json", { cache: "no-store" });
    const data = await res.json();
    DEALS = data.deals || [];
    STORE_LOGOS = data.storeLogos || {};
    STORE_LINKS = data.storeLinks || {};
    document.getElementById("last-updated").textContent = data.lastUpdated ? "Updated " + data.lastUpdated : "";
  } catch (e) {
    document.getElementById("last-updated").textContent = "Couldn't load deals.json";
    DEALS = [];
  }
  render();
}

function goHome() { view = "home"; activeCategory = null; query = ""; render(); window.scrollTo(0, 0); }
function goCategory(catId) { view = "category"; activeCategory = catId; query = ""; render(); window.scrollTo(0, 0); }

function dealTileHtml(d) {
  const s = storeInfo(d.store);
  const isFav = favProducts.has(d.name);
  const pct = discountPct(d);
  const up = unitPrice(d);
  const countdown = countdownLabel(d);
  const img = d.image
    ? `<img src="${d.image}" alt="" />`
    : `<div class="fallback-mark">${storeMark(d.store, 34)}</div>`;
  return `
    <div class="deal-tile">
      <div class="deal-tile-img-wrap">
        ${img}
        ${pct !== null ? `<span class="deal-badge">-${pct}%</span>` : `<span class="deal-badge offer">Offer</span>`}
        <button class="deal-star" data-fav="${encodeURIComponent(d.name)}" aria-label="Favorite this product">${starIcon(isFav)}</button>
        ${countdown ? `<span class="deal-countdown">${countdown}</span>` : ""}
      </div>
      <div class="deal-tile-body">
        <div class="deal-tile-name">${d.nameEn || d.name}</div>
        <div class="deal-tile-da">${d.name}</div>
        <div class="deal-tile-store">${storeMark(d.store, 12)}${s ? s.name : d.store} · ${d.unit || ""}
          ${STORE_LINKS[d.store] ? `<a href="${STORE_LINKS[d.store]}" target="_blank" rel="noopener" style="color:var(--accent); display:inline-flex;" title="Visit ${s ? s.name : d.store}'s website" onclick="event.stopPropagation()">${linkIcon()}</a>` : ""}
        </div>
        <div class="deal-tile-prices">
          <div class="row" style="gap:6px;">
            ${d.was ? `<span class="deal-tile-was">${d.was.toFixed(2)} kr</span>` : ""}
            <span class="deal-tile-now">${d.price.toFixed(2)} kr</span>
          </div>
          ${up ? `<div class="deal-tile-unitprice">${up.value.toFixed(2)} ${up.label}</div>` : ""}
        </div>
      </div>
    </div>`;
}

function attachFavListeners(root) {
  root.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const name = decodeURIComponent(btn.dataset.fav);
      favProducts.has(name) ? favProducts.delete(name) : favProducts.add(name);
      persistFavs();
      render();
    });
  });
}

function favoritesSectionHtml() {
  if (favProducts.size === 0) return "";
  const rows = [...favProducts].map(name => {
    const match = DEALS.find(d => textMatches(d.name, name));
    if (match) {
      const s = storeInfo(match.store);
      return `
        <div class="list-row">
          <div class="row"><button class="icon-btn" data-fav="${encodeURIComponent(name)}">${starIcon(true)}</button>
            <span style="font-size:14px;">${match.nameEn || name}</span></div>
          <span class="fav-status-on">On sale — ${match.price.toFixed(2)} kr at ${s ? s.name : match.store}</span>
        </div>`;
    }
    return `
      <div class="list-row">
        <div class="row"><button class="icon-btn" data-fav="${encodeURIComponent(name)}">${starIcon(true)}</button>
          <span style="font-size:14px;">${name}</span></div>
        <span class="fav-status-off">Not on sale this week</span>
      </div>`;
  }).join("");
  return `
    <section style="margin-bottom:32px;">
      <h2>Your favorite products</h2>
      <p class="muted" style="font-size:13px; margin-bottom:12px; margin-top:-10px;">Star a product anywhere on the site and it'll show up here, so you know the moment it's on sale again.</p>
      <div class="list-card">${rows}</div>
    </section>`;
}

function buildShoppingList() {
  const meals = MEALS.filter(m => listMealIds.has(m.id));
  const groups = {};
  const unmatched = [];
  const seen = new Set();
  meals.forEach(m => {
    m.ingredients.forEach(([da, en]) => {
      const key = da.toLowerCase();
      if (seen.has(key)) return;
      seen.add(key);
      const deal = DEALS.find(d => textMatches(d.name, da));
      if (deal) {
        (groups[deal.store] = groups[deal.store] || []).push({ da, en, deal });
      } else {
        unmatched.push({ da, en });
      }
    });
  });
  return { meals, groups, unmatched };
}

function shoppingListSectionHtml() {
  if (listMealIds.size === 0) return "";
  const { meals, groups, unmatched } = buildShoppingList();
  const groupsHtml = Object.entries(groups).map(([storeId, items]) => {
    const s = storeInfo(storeId);
    const itemsHtml = items.map(it => `
      <div class="shop-item">
        <span>${it.en} <span class="faint" style="font-size:11px;">(${it.da})</span></span>
        <span class="muted">${it.deal.price.toFixed(2)} kr</span>
      </div>`).join("");
    return `
      <div class="shop-group">
        <div class="shop-group-head">${storeMark(storeId, 14)}${s ? s.name : storeId}</div>
        ${itemsHtml}
      </div>`;
  }).join("");
  const unmatchedHtml = unmatched.length > 0 ? `
    <div class="shop-group">
      <div class="shop-group-head faint">Not on sale this week</div>
      ${unmatched.map(it => `<div class="shop-item"><span>${it.en} <span class="faint" style="font-size:11px;">(${it.da})</span></span></div>`).join("")}
    </div>` : "";
  return `
    <section style="margin-bottom:32px;">
      <div class="between" style="margin-bottom:4px;">
        <h2 style="margin-bottom:0;">Your shopping list</h2>
        <button class="chip" id="clear-list">Clear list</button>
      </div>
      <p class="muted" style="font-size:13px; margin-bottom:12px;">From ${meals.length} meal${meals.length === 1 ? "" : "s"} — grouped by store, matched against this week's deals.</p>
      <div class="list-card" style="padding:12px 16px;">${groupsHtml}${unmatchedHtml}</div>
    </section>`;
}

function tilesSectionHtml() {
  const realTiles = Object.entries(CATEGORY_META).map(([catId, meta]) => {
    const count = DEALS.filter(d => activeStores.has(d.store) && d.category === catId).length;
    return `
      <button class="tile" data-cat="${encodeURIComponent(catId)}" style="--tile-color:${meta.color}; --tile-soft:${meta.color}1A;">
        <div class="tile-icon">${meta.icon}</div>
        <div class="tile-name">${meta.en}</div>
        <div class="tile-sub">${catId}</div>
        <div class="tile-count">${count} deal${count === 1 ? "" : "s"}</div>
      </button>`;
  }).join("");
  const householdTile = `
    <button class="tile" data-cat="${encodeURIComponent(HOUSEHOLD_KEY)}" style="--tile-color:${HOUSEHOLD_META.color}; --tile-soft:${HOUSEHOLD_META.color}1A;">
      <div class="tile-icon">${HOUSEHOLD_META.icon}</div>
      <div class="tile-name">${HOUSEHOLD_META.en}</div>
      <div class="tile-sub">${HOUSEHOLD_META.da}</div>
      <div class="tile-count">Browse ideas</div>
    </button>`;
  return `
    <section style="margin-bottom:32px;">
      <h2>Browse by category</h2>
      <div class="tile-grid">${realTiles}${householdTile}</div>
    </section>`;
}

function topDealsSectionHtml() {
  const top = [...DEALS]
    .filter(d => activeStores.has(d.store))
    .sort((a, b) => (discountPct(b) ?? -1) - (discountPct(a) ?? -1))
    .slice(0, 8);
  if (top.length === 0) return `<p class="muted" style="font-size:14px;">No deals loaded yet.</p>`;
  return `
    <section style="margin-bottom:32px;">
      <h2>This week's best deals</h2>
      <div class="deal-grid">${top.map(dealTileHtml).join("")}</div>
    </section>`;
}

function categoryPageHtml() {
  const isHousehold = activeCategory === HOUSEHOLD_KEY;
  const meta = isHousehold ? HOUSEHOLD_META : CATEGORY_META[activeCategory];
  const backLink = `<a class="back" id="back-link">&larr; All categories</a>`;
  const header = `<h2 style="margin-bottom:4px;">${meta.icon} ${meta.en}</h2>`;

  if (isHousehold) {
    const rows = HOUSEHOLD_ITEMS.map(item => `
      <div class="list-row">
        <div style="flex:1; min-width:0;">
          <div style="font-size:14px; font-weight:500;">${item.en}</div>
          <div class="faint" style="font-size:11px;">${item.da}</div>
        </div>
        <div class="row" style="flex-wrap:wrap; justify-content:flex-end; gap:6px;">
          ${item.stores.map(sid => { const s = storeInfo(sid); return `<span class="store-tag">${s ? s.name : sid}</span>`; }).join("")}
        </div>
      </div>`).join("");
    return `
      ${backLink}
      ${header}
      <p class="muted" style="font-size:13px; margin-bottom:16px;">
        General ideas for what these stores tend to carry beyond groceries — not tied to weekly specials, so no prices here.
      </p>
      <div class="list-card">${rows}</div>`;
  }

  const deals = DEALS.filter(d =>
    d.category === activeCategory &&
    activeStores.has(d.store) &&
    (norm(d.name).includes(norm(query)) || norm(d.nameEn).includes(norm(query)))
  ).sort((a, b) => (discountPct(b) ?? -1) - (discountPct(a) ?? -1));

  const chips = STORES.map(s => `
    <button class="chip ${activeStores.has(s.id) ? "active" : ""}" data-store="${s.id}"
      style="border-color:${activeStores.has(s.id) ? s.color : ""}; background:${activeStores.has(s.id) ? s.color + "1A" : ""};">
      ${storeMark(s.id, 16)}${s.name}
    </button>`).join("");

  const list = deals.length === 0
    ? `<p class="muted" style="font-size:14px;">No deals match — try another search or store.</p>`
    : `<div class="deal-grid">${deals.map(dealTileHtml).join("")}</div>`;

  return `
    ${backLink}
    ${header}
    <div class="chips" style="margin-top:14px;">${chips}</div>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Search ${meta.en.toLowerCase()}…" value="${query}" />
    </div>
    ${list}`;
}

function rankedMeals() {
  const withMatches = MEALS.map(m => {
    const matched = m.ingredients.map(([da, en]) => ({
      da, en, deal: DEALS.find(d => textMatches(d.name, da)),
    })).filter(x => x.deal);
    return { ...m, matched, matchCount: matched.length };
  });
  const list = savedOnly ? withMatches.filter(m => savedIds.has(m.id)) : withMatches;
  return list.sort((a, b) => b.matchCount - a.matchCount);
}

function mealsSectionHtml() {
  const meals = rankedMeals();
  const noSaved = savedOnly && meals.length === 0
    ? `<p class="muted" style="font-size:14px;">No saved recipes yet — tap the heart on a meal to save it here.</p>`
    : "";
  const cards = meals.map(m => {
    const open = openMealId === m.id;
    const isSaved = savedIds.has(m.id);
    const inList = listMealIds.has(m.id);
    const ingredientsHtml = m.ingredients.map(([da, en]) => {
      const match = m.matched.find(x => x.da === da);
      return `<li class="ing-row"><span>${en} <span class="faint" style="font-size:11px;">(${da})</span></span>
        ${match ? `<span style="font-size:11px; color:var(--accent); font-weight:500; white-space:nowrap;">${storeInfo(match.deal.store).name} · ${match.deal.price.toFixed(2)} kr</span>` : ""}</li>`;
    }).join("");
    const stepsHtml = m.steps.map(s => `<li>${s}</li>`).join("");
    return `
      <div class="meal-card ${open ? "open" : ""}" data-id="${m.id}">
        <div class="between" style="align-items:flex-start;">
          <div>
            <h3 style="font-weight:600; font-size:16px; margin:0;">${m.nameEn}</h3>
            <div class="faint" style="font-size:12px; margin-top:2px;">${m.name}</div>
          </div>
          <div class="row" style="flex-shrink:0; gap:2px;">
            <button class="icon-btn" data-list="${m.id}" aria-label="Add to shopping list" title="Add to shopping list">${basketIcon(inList)}</button>
            <button class="icon-btn" data-heart="${m.id}" aria-label="Save recipe">${heartIcon(isSaved)}</button>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6A62" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <div class="row" style="gap:14px; margin-top:10px; font-size:12px;">
          <span class="row muted" style="gap:4px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6A62" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${m.time} min</span>
          <span class="muted">${m.servings} servings</span>
          <span style="color:var(--accent); font-weight:500;">${m.matchCount}/${m.ingredients.length} on sale</span>
        </div>
        <div class="meal-detail">
          <div class="section-label">Ingredients you'll need</div>
          <ul>${ingredientsHtml}</ul>
          <div class="section-label">Steps</div>
          <ol>${stepsHtml}</ol>
        </div>
      </div>`;
  }).join("");

  return `
    <section>
      <div class="between" style="margin-bottom:4px;">
        <h2 style="margin-bottom:0;">Quick dinners from this week's deals</h2>
        <button class="chip ${savedOnly ? "active" : ""}" id="saved-toggle">${heartIcon(savedOnly)} Saved only</button>
      </div>
      <p class="muted" style="font-size:13px; margin-bottom:16px;">
        Tap a meal to see every ingredient and the steps. Tap the basket to add it to your shopping list.
      </p>
      ${noSaved}
      <div class="meal-grid">${cards}</div>
    </section>`;
}

function heroHtml() {
  if (DEALS.length === 0) return "";
  const best = [...DEALS].filter(d => discountPct(d) !== null).sort((a, b) => discountPct(b) - discountPct(a))[0] || DEALS[0];
  if (!best) return "";
  const s = storeInfo(best.store);
  const bestPct = discountPct(best);
  const heroThumb = best.image
    ? `<img src="${best.image}" alt="" style="width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0; border:1px solid var(--line);" />`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B7A5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.5-6.5-2 2m-9 9-2 2m13-2-2-2m-9-9-2-2"/></svg>`;
  return `
    <div class="hero">
      ${heroThumb}
      <div>${bestPct !== null ? "Biggest saving" : "Featured deal"} this week: <strong>${best.nameEn || best.name}</strong>
      <span class="faint">(${best.name})</span>
      (${best.unit || ""}) at <strong style="color:${s ? s.color : "inherit"}">${s ? s.name : best.store}</strong> —
      ${bestPct !== null
        ? `${best.price.toFixed(2)} kr instead of ${best.was.toFixed(2)} kr, ${bestPct}% off.`
        : `${best.price.toFixed(2)} kr this week.`}</div>
    </div>`;
}

function render() {
  const root = document.getElementById("main-content");
  if (view === "category") {
    root.innerHTML = categoryPageHtml();
    document.getElementById("back-link")?.addEventListener("click", goHome);
    root.querySelectorAll("[data-store]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.store;
        activeStores.has(id) ? activeStores.delete(id) : activeStores.add(id);
        render();
      });
    });
    const searchInput = document.getElementById("search");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => { query = e.target.value; render(); });
      searchInput.focus();
      searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
    }
    attachFavListeners(root);
  } else {
    root.innerHTML =
      heroHtml() +
      favoritesSectionHtml() +
      shoppingListSectionHtml() +
      tilesSectionHtml() +
      topDealsSectionHtml() +
      mealsSectionHtml();

    root.querySelectorAll("[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => goCategory(decodeURIComponent(btn.dataset.cat)));
    });
    document.getElementById("saved-toggle")?.addEventListener("click", () => { savedOnly = !savedOnly; render(); });
    document.getElementById("clear-list")?.addEventListener("click", () => { listMealIds.clear(); persistList(); render(); });
    root.querySelectorAll(".meal-card").forEach(card => {
      card.addEventListener("click", (e) => {
        if (e.target.closest("[data-heart]") || e.target.closest("[data-list]")) return;
        const id = card.dataset.id;
        openMealId = openMealId === id ? null : id;
        render();
      });
    });
    root.querySelectorAll("[data-heart]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = btn.dataset.heart;
        savedIds.has(id) ? savedIds.delete(id) : savedIds.add(id);
        persistSaved();
        render();
      });
    });
    root.querySelectorAll("[data-list]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = btn.dataset.list;
        listMealIds.has(id) ? listMealIds.delete(id) : listMealIds.add(id);
        persistList();
        render();
      });
    });
    attachFavListeners(root);
  }
}

document.getElementById("home-link").addEventListener("click", goHome);
loadDeals();
</script>
</body>
</html>
